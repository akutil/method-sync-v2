# CI — the loop nobody can skip. Adapted from the Project Factory template (ADR-0001).
# Mirrors the local gates deterministically: if it isn't green here, it isn't
# done, regardless of what any agent or human claims.
#
# method-sync-v2 adaptation: the tool is stdlib Python and has no UI and no DB, so the
# Playwright / DB / tsc steps of the template are gone. The integration and end-to-end
# layers need the private target library, Maven and a live exchange — they run locally and
# their evidence is committed under runs/ and docs/qa/ (see docs/current-state.md).
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      OPENSPEC_TELEMETRY: "0"   # OpenSpec sends anonymous usage stats by default
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # check-trajectory reads Slice: trailers from history
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - run: npm ci

      # --- static, fast, deterministic ---
      - name: Lint (byte-compile, warnings as errors)
        run: npm run lint
      - name: Traceability chain (and freshness of generated report)
        run: |
          node scripts/check-traceability.mjs --check-fresh
          node scripts/check-traceability.mjs ${{ (github.ref_name == 'main' || github.ref_name == 'master') && '--release' || '' }}
      - name: Trajectory process audit (and freshness)
        run: |
          node scripts/check-trajectory.mjs --check-fresh
          node scripts/check-trajectory.mjs ${{ (github.ref_name == 'main' || github.ref_name == 'master') && '--release' || '' }}
      - name: OpenSpec strict validation
        run: npx openspec validate --all --strict
      - name: Factory integrity lock
        run: node scripts/check-factory-integrity.mjs
      - name: Dependency audit (fail on high+)
        run: npm audit --audit-level=high

      # --- test battery ---
      - name: Unit tests (tool + stage-gate hook selftest)
        run: npm run test:run

      # --- build ---
      - name: Build (byte-compile the package)
        run: npm run build

      # --- evidence ---
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-evidence
          path: |
            docs/qa/traceability-report.md
            docs/qa/trajectory-report.md
            trace/trace.json
          if-no-files-found: ignore
